<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; background:#f5f6fa; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
        .card { background:white; padding:24px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1); width:320px; }
        .card h1 { font-size:20px; margin:0 0 12px; }
        .form-group { margin-bottom:12px; }
        label { display:block; font-size:13px; margin-bottom:6px; }
        input[type="text"], input[type="password"] { width:100%; padding:8px 10px; border:1px solid #cbd5e1; border-radius:4px; box-sizing:border-box; }
        .actions { display:flex; gap:8px; margin-top:12px; }
        button { flex:1; padding:8px 10px; border:none; border-radius:4px; background:#2563eb; color:white; cursor:pointer; }
        button.secondary { background:#6b7280; }
        .msg { margin-bottom:12px; padding:8px 10px; border-radius:4px; background:#fee2e2; color:#7f1d1d; font-size:14px; }
        .link { display:block; margin-top:10px; text-align:center; font-size:13px; color:#374151; text-decoration:none; }
    </style>
</head>
<body>
    <main class="card" role="main">
        <h1>Entrar</h1>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for m in messages %}
              <div class="msg">{{ m }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% if error %}
          <div class="msg">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="post" autocomplete="off">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input id="username" name="username" type="text" required autofocus
                       value="{{ request.form.username or '' }}">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input id="password" name="password" type="password" required>
            </div>

            <div class="actions">
                <button type="submit">Entrar</button>

                <button type="submit" class="secondary"
                        formmethod="post"
                        formaction="{{ url_for('rotalogin') }}">
                    Entrar (rotalogin)
                </button>
            </div>
        </form>

        <a class="link" href="{{ url_for('index') }}">Voltar à página inicial</a>
    </main>
</body>
</html>
